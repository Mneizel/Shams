# .github/workflows/learn.yml — التعلّمُ اليوميّ من إجابات الناس (مجّانيّ: أقلُّ من دقيقةٍ في اليوم)
# يقرأُ مستودعَ الإجابات الخاصّ shams-feedback، ويحسبُ أوزانَ العارف، ويحفظُها في data/feedback-learned.data.js،
# ثمّ يعيدُ بناءَ النسخة المستقلّة، ويحفظُ التغييرَ في هذا المستودع (فيتحدّثُ الموقعُ وحدَه).
# يحتاجُ سرًّا واحدًا في إعدادات هذا المستودع: FEEDBACK_READ_TOKEN (قراءةٌ فقط لمستودع shams-feedback).
name: learn-from-feedback

on:
  schedule:
    - cron: "30 4 * * *"   # كلَّ يومٍ ٤:٣٠ بتوقيت غرينتش (بعد إرسال Apps Script الساعة ٣ بتوقيتك)
  workflow_dispatch: {}     # تشغيلٌ يدويّ من تبويب Actions للتجربة

permissions:
  contents: write

concurrency:
  group: learn-from-feedback
  cancel-in-progress: false

jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: الموقع
        uses: actions/checkout@v5

      - name: مستودعُ الإجابات (قراءةٌ فقط)
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/shams-feedback
          token: ${{ secrets.FEEDBACK_READ_TOKEN }}
          path: feedback-src

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: حسابُ الأوزان المتعلَّمة
        run: |
          if [ -d feedback-src/feedback ]; then node tools/build-feedback.js feedback-src; else echo "لا إجاباتٍ بعد"; fi

      - name: إعادةُ بناء النسخة المستقلّة
        run: node tools/build-standalone.js

      - name: حفظُ ما تعلّمه
        run: |
          rm -rf feedback-src
          git config user.name "shams-learner"
          git config user.email "shams-learner@users.noreply.github.com"
          git add data/feedback-learned.data.js "web/شمس-المعارف.html"
          if git diff --cached --quiet; then echo "لا جديد"; exit 0; fi
          git commit -m "التعلّم اليوميّ من الإجابات"
          git push
